<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leads Insights Dashboard - Ezzy Free CRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="../site-hf/version.js"></script>
    <style>
        /* Stats Dashboard styling */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 0 32px 24px;
        }
        .stat-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.7));
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
        }
        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background-color: rgba(99, 102, 241, 0.1);
            color: var(--primary);
        }
        .stat-icon.green {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--status-qualified);
        }
        .stat-icon.blue {
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--status-new);
        }
        .stat-icon.pink {
            background-color: rgba(236, 72, 153, 0.1);
            color: var(--accent);
        }
        .stat-info h3 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .stat-info p {
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Filter Panel Styling */
        .filter-panel {
            background-color: rgba(30, 41, 59, 0.3);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 20px;
            margin: 0 32px 24px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            align-items: end;
        }
        .filter-panel .search-group {
            grid-column: span 2;
        }
        @media (max-width: 1200px) {
            .filter-panel {
                grid-template-columns: 1fr 1fr;
            }
            .filter-panel .search-group {
                grid-column: span 2;
            }
        }
        @media (max-width: 600px) {
            .filter-panel {
                grid-template-columns: 1fr;
            }
            .filter-panel .search-group {
                grid-column: span 1;
            }
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .filter-group label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }
        .filter-group input, .filter-group select {
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            outline: none;
            font-size: 14px;
            transition: var(--transition);
            width: 100%;
        }
        .filter-group input:focus, .filter-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        /* Interactive badge and table rows */
        .lead-details-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .lead-details-badge:hover {
            background-color: var(--primary);
            color: white;
        }

        /* Collapsible Lead Details Row */
        .details-row {
            background-color: rgba(15, 23, 42, 0.4);
        }
        .details-row.hidden {
            display: none;
        }
        .details-container {
            padding: 24px 32px;
            border-left: 4px solid var(--primary);
            animation: slideDown 0.25s ease-out;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .expanded-details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        @media (max-width: 768px) {
            .expanded-details-grid {
                grid-template-columns: 1fr;
            }
        }

        .details-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px 20px;
        }
        .details-card h4 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .details-card h4 i {
            color: var(--primary);
        }

        .details-info-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .details-info-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .details-info-item label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        .details-info-item span {
            font-size: 14px;
            color: var(--text-main);
        }

        .btn-toggle-detail {
            transition: transform 0.2s ease;
            color: var(--text-muted);
            font-size: 14px;
            padding: 4px;
        }
        .btn-toggle-detail.active {
            transform: rotate(90deg);
            color: var(--primary);
        }

        /* Quality Stars */
        .quality-rating {
            color: #f59e0b;
            font-size: 13px;
            white-space: nowrap;
        }

        /* Result Badges */
        .result-badge-dash {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .result-badge-dash.won { background-color: rgba(16, 185, 129, 0.1); color: var(--status-qualified); border: 1px solid rgba(16, 185, 129, 0.2); }
        .result-badge-dash.lost { background-color: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
        .result-badge-dash.abandoned { background-color: rgba(100, 116, 139, 0.1); color: var(--text-muted); border: 1px solid rgba(100, 116, 139, 0.2); }
        .result-badge-dash.pending { background-color: rgba(59, 130, 246, 0.1); color: var(--status-new); border: 1px solid rgba(59, 130, 246, 0.2); }

        /* Timeline in details */
        .timeline-mini {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 6px;
        }
        .timeline-mini-item {
            border-left: 2px solid var(--primary);
            padding-left: 12px;
            position: relative;
            padding-bottom: 4px;
        }
        .timeline-mini-item::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--primary);
            position: absolute;
            left: -5px;
            top: 4px;
        }
        .timeline-mini-meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 2px;
        }
        .timeline-mini-text {
            font-size: 13px;
            line-height: 1.4;
        }

        .no-results-container {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        .no-results-container i {
            font-size: 40px;
            margin-bottom: 12px;
            color: var(--border-color);
        }

        .tag-pill-dash {
            display: inline-block;
            padding: 2px 6px;
            background-color: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            border-radius: 4px;
            font-size: 11px;
            margin-right: 4px;
            margin-bottom: 4px;
        }
        .view-section {
            display: block;
            overflow-y: auto;
        }
    </style>
</head>

    <!-- Script Block for Dashboard Logic -->
    <script src="../js/location-utils.js"></script>
    <script>
        const API_BASE = '/api';
        let leads = [];
        let companies = [];

        function getLeadQualityValue(lead) {
            const quality = Number(lead?.quality);
            const qualityVal = Number(lead?.qualityVal);
            if (!Number.isNaN(quality) && quality > 0) return quality;
            if (!Number.isNaN(qualityVal) && qualityVal > 0) return qualityVal;
            return 0;
        }

        // Track currently expanded lead IDs
        const expandedLeadIds = new Set();

        document.addEventListener('DOMContentLoaded', async () => {
            // Update version displays dynamically
            if (typeof APP_VERSION !== 'undefined') {
                document.querySelectorAll('.appVersionDisplay').forEach(el => el.textContent = APP_VERSION);
            }

            // Load Sidebar dynamically
            try {
                const sidebarRes = await fetch('../site-hf/sidebar.html');
                let sidebarHtml = await sidebarRes.text();
                sidebarHtml = sidebarHtml.replace(/href="(?!\.\.\/|http)([^"]+)"/g, 'href="../$1"');
                const sidebarEl = document.querySelector('.sidebar');
                if (sidebarEl) {
                    sidebarEl.innerHTML = sidebarHtml;
                    if (localStorage.getItem('sidebarCollapsed') === 'true') {
                        sidebarEl.classList.add('collapsed');
                    }
                    const toggleBtn = sidebarEl.querySelector('#sidebarToggle');
                    if (toggleBtn) {
                        toggleBtn.addEventListener('click', () => {
                            sidebarEl.classList.toggle('collapsed');
                            localStorage.setItem('sidebarCollapsed', sidebarEl.classList.contains('collapsed'));
                        });
                    }
                    const activeEl = document.getElementById('nav-lead-db');
                    if (activeEl) activeEl.classList.add('active');
                }
            } catch (err) {
                console.error('Error loading sidebar:', err);
            }

            // Load Leads Tab Navigation
            try {
                const navRes = await fetch('../site-hf/leads-nav.html');
                let navHtml = await navRes.text();
                navHtml = navHtml.replace(/{root}/g, '../');
                const navContainer = document.getElementById('leadsNavContainer');
                if (navContainer) {
                    navContainer.innerHTML = navHtml;
                    document.getElementById('tab-lead-dashboard').classList.add('active');
                }
            } catch (err) {
                console.error('Error loading leads nav:', err);
            }

            // Bind Lead Limit Select
            const limitSelect = document.getElementById('leadLimitSelect');
            if (limitSelect) {
                const savedLimit = localStorage.getItem('leadLimit') || '500';
                limitSelect.value = savedLimit;
                limitSelect.addEventListener('change', async (e) => {
                    const newLimit = e.target.value;
                    localStorage.setItem('leadLimit', newLimit);
                    await loadDashboardData();
                });
            }

            // Bind listeners for filters and search
            document.getElementById('searchQuery').addEventListener('input', applyFiltersAndRender);
            document.getElementById('filterCountry').addEventListener('change', () => {
                populateStateDropdown(document.getElementById('filterCountry').value);
                applyFiltersAndRender();
            });
            document.getElementById('filterState').addEventListener('change', applyFiltersAndRender);
            document.getElementById('filterRequirement').addEventListener('change', applyFiltersAndRender);
            document.getElementById('filterStatus').addEventListener('change', applyFiltersAndRender);
            document.getElementById('filterResult').addEventListener('change', applyFiltersAndRender);
            document.getElementById('filterQuality').addEventListener('change', applyFiltersAndRender);
            document.getElementById('sortBy').addEventListener('change', applyFiltersAndRender);
            document.getElementById('filterSource').addEventListener('change', applyFiltersAndRender);
            document.getElementById('filterTags').addEventListener('change', applyFiltersAndRender);

            // Fetch Initial Data
            await loadDashboardData();
        });

        async function loadDashboardData() {
            try {
                const limit = localStorage.getItem('leadLimit') || '500';
                // Fetch datasets
                const [leadsRes, companiesRes] = await Promise.all([
                    fetch(`${API_BASE}/leads?limit=${limit}`),
                    fetch(`${API_BASE}/companies`)
                ]);

                leads = await leadsRes.json();
                // Normalize quality and qualityVal fields for dashboard logic
                leads.forEach(lead => {
                    const normalizedQuality = getLeadQualityValue(lead);
                    lead.quality = normalizedQuality;
                    lead.qualityVal = normalizedQuality;
                });
                companies = await companiesRes.json();

                // Populate filter dropdowns
                populateFilterDropdowns();

                // Calculate and Render Metrics
                calculateAndRenderStats();

                // Initial render
                applyFiltersAndRender();

            } catch (error) {
                console.error('Error fetching dashboard datasets:', error);
                document.getElementById('leadsDashboardList').innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 40px; color: #ef4444;">
                            <i class="fas fa-exclamation-triangle" style="margin-right: 8px;"></i> Failed to load leads database. Please ensure backend is running.
                        </td>
                    </tr>
                `;
            }
        }

        function populateFilterDropdowns() {
            const countrySelect = document.getElementById('filterCountry');
            const currentCountry = countrySelect.value;
            countrySelect.innerHTML = '<option value="All">All Countries</option>';

            const countriesSet = new Set();
            leads.forEach(lead => {
                const { country, state } = parseLocationDetails(lead.country, lead.state, lead.location);
                lead.derivedCountry = country;
                lead.derivedState = state;
                if (country && country !== 'Others') countriesSet.add(country);
            });

            const sortedCountries = [...countriesSet].sort();
            sortedCountries.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                countrySelect.appendChild(opt);
            });

            if ([...countriesSet].includes(currentCountry)) {
                countrySelect.value = currentCountry;
            } else {
                countrySelect.value = 'All';
            }

            populateStateDropdown(countrySelect.value);
        }

        function populateStateDropdown(selectedCountry = 'All') {
            const stateSelect = document.getElementById('filterState');
            const currentState = stateSelect.value;
            stateSelect.innerHTML = '<option value="All">All States</option>';

            const statesSet = new Set();
            leads.forEach(lead => {
                const { country, state } = lead.derivedCountry !== undefined 
                    ? lead 
                    : parseLocationDetails(lead.country, lead.state, lead.location);

                if (state && state !== 'Others' && (selectedCountry === 'All' || country === selectedCountry)) {
                    statesSet.add(state);
                }
            });

            const sortedStates = [...statesSet].sort();
            sortedStates.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                stateSelect.appendChild(opt);
            });

            if ([...statesSet].includes(currentState)) {
                stateSelect.value = currentState;
            } else {
                stateSelect.value = 'All';
            }
        }

        function calculateAndRenderStats(filteredLeads) {
            const activeLeads = filteredLeads || leads;
            const totalLeads = activeLeads.length;

            const wonLeads = activeLeads.filter(l => (l.result || '').toLowerCase() === 'won').length;
            const qualifiedLeads = activeLeads.filter(l => (l.status || '').toLowerCase() === 'qualified').length;
            const winRate = totalLeads > 0 ? Math.round((wonLeads / totalLeads) * 100) : 0;

            document.getElementById('statTotalLeads').textContent = totalLeads;
            document.getElementById('statWonLeads').textContent = wonLeads;
            document.getElementById('statQualifiedLeads').textContent = qualifiedLeads;
            document.getElementById('statWinRate').textContent = `${winRate}%`;
        }

        function applyFiltersAndRender() {
            const query = document.getElementById('searchQuery').value.toLowerCase().trim();
            const selectedCountry = document.getElementById('filterCountry').value;
            const selectedState = document.getElementById('filterState').value;
            const selectedReq = document.getElementById('filterRequirement').value;
            const selectedStatus = document.getElementById('filterStatus').value;
            const selectedResult = document.getElementById('filterResult').value;
            const minQuality = parseInt(document.getElementById('filterQuality').value) || 0;
            const sortOrder = document.getElementById('sortBy').value;
            const selectedSource = document.getElementById('filterSource').value;
            const selectedTags = document.getElementById('filterTags').value;

            // Filter Leads
            let result = leads.filter(lead => {
                // 1. Search Query
                const nameMatch = (lead.name || '').toLowerCase().includes(query);
                const compMatch = (lead.company || '').toLowerCase().includes(query);
                const reqMatch = (lead.requirement || '').toLowerCase().includes(query);
                const tagsString = Array.isArray(lead.tags) ? lead.tags.join(' ') : (lead.tags || '');
                const tagsMatch = tagsString.toLowerCase().includes(query);
                const noteMatch = (lead.notes || '').toLowerCase().includes(query);
                const sourceMatch = (lead.source || '').toLowerCase().includes(query);
                const sourceTagMatch = (lead.sourceTag || '').toLowerCase().includes(query);
                const locMatch = (lead.location || '').toLowerCase().includes(query);

                const matchesSearch = !query || nameMatch || compMatch || reqMatch || tagsMatch || noteMatch || sourceMatch || sourceTagMatch || locMatch;

                // 2. Country & State Filters
                const { country, state } = lead.derivedCountry !== undefined 
                    ? { country: lead.derivedCountry, state: lead.derivedState }
                    : parseLocationDetails(lead.country, lead.state, lead.location);
                
                const matchesCountry = selectedCountry === 'All' || country === selectedCountry;
                const matchesState = selectedState === 'All' || state === selectedState;

                // 3. Requirement filter (category mapping)
                let matchesRequirement = true;
                if (selectedReq !== 'All') {
                    const reqStr = (lead.requirement || '').toLowerCase();
                    const tagsStr = (Array.isArray(lead.tags) ? lead.tags.join(' ') : (lead.tags || '')).toLowerCase();
                    const filterKey = selectedReq.toLowerCase();
                    
                    if (filterKey === 'counting') {
                        matchesRequirement = reqStr.includes('counting') || reqStr.includes('counter') || tagsStr.includes('counting') || tagsStr.includes('counter');
                    } else if (filterKey === 'powder') {
                        matchesRequirement = reqStr.includes('powder') || reqStr.includes('auger') || tagsStr.includes('powder') || tagsStr.includes('auger');
                    } else if (filterKey === 'line') {
                        matchesRequirement = reqStr.includes('line') || reqStr.includes('turnkey') || tagsStr.includes('line') || tagsStr.includes('turnkey');
                    } else {
                        matchesRequirement = reqStr.includes(filterKey) || tagsStr.includes(filterKey);
                    }
                }

                // 4. Status Filter
                const matchesStatus = selectedStatus === 'All' || lead.status === selectedStatus;

                // 5. Result Filter
                const matchesResult = selectedResult === 'All' || lead.result === selectedResult;

                // 6. Quality Filter
                const qualityVal = getLeadQualityValue(lead);
                const matchesQuality = minQuality === 0 || qualityVal >= minQuality;

                // 7. Source Filter
                let matchesSource = true;
                if (selectedSource !== 'All') {
                    const srcStr = (lead.source || '').toLowerCase();
                    const srcTagStr = (lead.sourceTag || '').toLowerCase();
                    matchesSource = srcStr.includes(selectedSource.toLowerCase()) || srcTagStr.includes(selectedSource.toLowerCase());
                }
                
                // 8. Tags Filter
                let matchesTag = true;
                if (selectedTags !== 'All') {
                    const tagsStr = (Array.isArray(lead.tags) ? lead.tags.join(' ') : (lead.tags || '')).toLowerCase();
                    matchesTag = tagsStr.includes(selectedTags.toLowerCase());
                }

                return matchesSearch && matchesCountry && matchesState && matchesRequirement && matchesStatus && matchesResult && matchesQuality && matchesSource && matchesTag;
            });

            // Sort Leads
            if (sortOrder === 'date-desc') {
                result.sort((a, b) => {
                    const dateA = new Date(a.leadDate || a.createdAt || 0);
                    const dateB = new Date(b.leadDate || b.createdAt || 0);
                    return dateB - dateA;
                });
            } else if (sortOrder === 'date-asc') {
                result.sort((a, b) => {
                    const dateA = new Date(a.leadDate || a.createdAt || 0);
                    const dateB = new Date(b.leadDate || b.createdAt || 0);
                    return dateA - dateB;
                });
            } else if (sortOrder === 'quality-desc') {
                result.sort((a, b) => getLeadQualityValue(b) - getLeadQualityValue(a));
            } else if (sortOrder === 'quality-asc') {
                result.sort((a, b) => getLeadQualityValue(a) - getLeadQualityValue(b));
            } else if (sortOrder === 'name-asc') {
                result.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            } else if (sortOrder === 'company-asc') {
                result.sort((a, b) => (a.company || '').localeCompare(b.company || ''));
            }

            // Calculate and Render Metrics for filtered dataset
            calculateAndRenderStats(result);

            renderLeadsDashboardTable(result);
        }

        function renderLeadsDashboardTable(filteredData) {
            const list = document.getElementById('leadsDashboardList');
            if (!list) return;

            if (filteredData.length === 0) {
                list.innerHTML = `
                    <tr>
                        <td colspan="7">
                            <div class="no-results-container">
                                <i class="fas fa-database"></i>
                                <h3>No matching leads found</h3>
                                <p>Try clearing your search query or adjusting filters.</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            list.innerHTML = '';
            filteredData.forEach(lead => {
                const isExpanded = expandedLeadIds.has(lead.id);

                // Date and source tag formatting
                const dStr = lead.leadDate || lead.createdAt;
                const dateStr = dStr && !isNaN(new Date(dStr).getTime()) ? new Date(dStr).toLocaleDateString() : 'Unknown';
                let sourceText = lead.source || 'Direct';
                if (lead.sourceTag) sourceText += ` — ${lead.sourceTag}`;

                // Quality rendering (star value)
                const qualityVal = getLeadQualityValue(lead);
                let starsHtml = '';
                if (qualityVal > 0) {
                    const stars = Math.min(5, Math.ceil(qualityVal / 2)); // map 1-10 quality to 1-5 stars
                    starsHtml = '<span class="quality-rating" title="Quality rating: ' + qualityVal + '/10">';
                    for (let i = 1; i <= 5; i++) {
                        starsHtml += `<i class="${i <= stars ? 'fas' : 'far'} fa-star"></i>`;
                    }
                    starsHtml += '</span>';
                } else {
                    starsHtml = '<span class="text-muted" style="font-size: 12px;">Not Rated</span>';
                }

                // Tags parsing
                let tagsHtml = '';
                if (lead.tags) {
                    const tagList = (Array.isArray(lead.tags) ? lead.tags : lead.tags.split(',')).map(t => t.trim()).filter(Boolean);
                    tagsHtml = `<div style="margin-top: 6px;">
                        ${tagList.map(t => `<span class="tag-pill-dash">${t}</span>`).join('')}
                    </div>`;
                }

                // Status & Result styling
                const statusClass = lead.status || 'New';
                const resultText = lead.result || 'Pending';
                const resultClass = resultText.toLowerCase();

                // Contact list values
                const phones = lead.phones && lead.phones.length > 0 ? lead.phones : (lead.phone ? [lead.phone] : []);
                const emails = lead.emails && lead.emails.length > 0 ? lead.emails : (lead.email ? [lead.email] : []);

                // Auto-reply link parameters prefilled
                const firstPhone = phones[0] || '';
                const firstEmail = emails[0] || '';
                const autoReplyUrl = `../auto-reply/machine-based-question.html?name=${encodeURIComponent(lead.name || '')}&company=${encodeURIComponent(lead.company || '')}&phone=${encodeURIComponent(firstPhone)}&email=${encodeURIComponent(firstEmail)}&location=${encodeURIComponent(lead.location || '')}&query=${encodeURIComponent(lead.requirement || '')}`;

                // Setup table rows
                const trMain = document.createElement('tr');
                trMain.id = `lead-row-${lead.id}`;
                trMain.style.cursor = 'pointer';
                trMain.innerHTML = `
                    <td style="text-align: center;">
                        <i class="fas fa-chevron-right btn-toggle-detail ${isExpanded ? 'active' : ''}" onclick="toggleLeadDetails('${lead.id}', event)"></i>
                    </td>
                    <td>
                        <strong>${dateStr}</strong><br>
                        <small class="text-muted"><i class="fas fa-tag" style="font-size: 11px;"></i> ${sourceText}</small>
                    </td>
                    <td>
                        <strong><a href="lead-details.html?id=${lead.id}" target="_blank" style="color: var(--text-main); font-weight: 600; text-decoration: none; border-bottom: 1px dashed var(--primary); transition: var(--transition);" onclick="event.stopPropagation();">${lead.name || 'Unnamed Contact'}</a></strong><br>
                        <small class="text-muted"><i class="fas fa-building" style="font-size: 11px;"></i> ${lead.company || 'Individual / Unknown'}</small>
                    </td>
                    <td style="max-width: 250px;">
                        <div style="font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${lead.requirement || ''}">
                            ${lead.requirement || '<span class="text-muted">-</span>'}
                        </div>
                        ${tagsHtml}
                    </td>
                    <td>${starsHtml}</td>
                    <td>
                        <div class="status-stack">
                            <span class="status-badge ${statusClass}">${statusClass}</span>
                            <span class="result-badge-dash ${resultClass}">${resultText}</span>
                        </div>
                    </td>
                    <td style="text-align: right; padding-right: 24px;">
                        <div style="display: inline-flex; gap: 8px;">
                            <a href="lead-details.html?id=${lead.id}" target="_blank" class="btn btn-primary-light btn-sm" title="View Lead Details Page" onclick="event.stopPropagation();">
                                <i class="fas fa-info-circle"></i> Profile
                            </a>
                            <a href="${autoReplyUrl}" class="btn btn-secondary btn-sm" title="Generate AI Response" onclick="event.stopPropagation();" target="_blank">
                                <i class="fas fa-robot" style="color: var(--primary);"></i> Auto Reply
                            </a>
                        </div>
                    </td>
                `;

                // Collapsible detail row HTML
                const trDetail = document.createElement('tr');
                trDetail.id = `detail-row-${lead.id}`;
                trDetail.className = `details-row ${isExpanded ? '' : 'hidden'}`;

                // Timeline rendering
                let timelineHtml = '<p class="text-muted" style="font-size: 13px;">No follow-up interactions logged yet.</p>';
                if (lead.followUps && lead.followUps.length > 0) {
                    // Sort followups chronologically (latest first or oldest first). Let's do latest first for timeline.
                    const sortedFollowUps = [...lead.followUps].sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
                    timelineHtml = `
                        <div class="timeline-mini">
                            ${sortedFollowUps.map(f => {
                                const fDate = f.date ? new Date(f.date).toLocaleDateString() : 'Unknown Date';
                                return `
                                    <div class="timeline-mini-item">
                                        <div class="timeline-mini-meta">
                                            <strong>${fDate}</strong> ${f.status ? `| Status: <span style="color: var(--primary); font-weight:600;">${f.status}</span>` : ''} ${f.result ? `| Result: <span style="color: var(--status-qualified); font-weight:600;">${f.result}</span>` : ''}
                                        </div>
                                        <div class="timeline-mini-text">${f.notes || f.comment || 'Interaction logged.'}</div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                }

                // Phone/email layouts
                const phoneBlock = phones.map(p => `<div><i class="fas fa-phone" style="font-size: 11px; margin-right: 6px; color: var(--primary);"></i>${p}</div>`).join('');
                const emailBlock = emails.map(e => `<div><i class="fas fa-envelope" style="font-size: 11px; margin-right: 6px; color: var(--primary);"></i>${e}</div>`).join('');

                trDetail.innerHTML = `
                    <td colspan="7">
                        <div class="details-container">
                            <div class="expanded-details-grid">
                                <!-- Technical Details Card -->
                                <div class="details-card">
                                    <h4><i class="fas fa-align-left"></i> Inquiry Notes & Contact</h4>
                                    <div class="details-info-list">
                                        <div class="details-info-item">
                                            <label>Requirement Notes</label>
                                            <span style="font-size: 13px; line-height: 1.5; background: rgba(0,0,0,0.1); padding: 8px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.03); max-height: 120px; overflow-y: auto;">
                                                ${lead.notes || lead.requirement || 'No notes specified.'}
                                            </span>
                                        </div>
                                        <div class="details-info-item">
                                            <label>Location & Address</label>
                                            <span>${lead.location || 'Not Specified'} ${lead.address ? ` — ${lead.address}` : ''}</span>
                                        </div>
                                        <div class="details-info-item">
                                            <label>Contact Channels</label>
                                            <div class="contact-info-small" style="display:flex; flex-direction:column; gap:4px; margin-top: 4px;">
                                                ${phoneBlock}
                                                ${emailBlock}
                                                ${lead.website ? `<div><i class="fas fa-globe" style="font-size:11px; margin-right:6px; color:var(--primary);"></i><a href="${lead.website.startsWith('http') ? lead.website : 'https://'+lead.website}" target="_blank" style="color:var(--primary); text-decoration:none;">${lead.website}</a></div>` : ''}
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Followup Timeline Card -->
                                <div class="details-card">
                                    <h4><i class="fas fa-history"></i> Follow-up Interactions (${lead.followUps ? lead.followUps.length : 0})</h4>
                                    ${timelineHtml}
                                </div>
                            </div>
                        </div>
                    </td>
                `;

                // Add row toggle handler on clicking main td's (except action/website links)
                trMain.addEventListener('click', (e) => {
                    if (e.target.tagName.toLowerCase() !== 'a' && !e.target.closest('a') && !e.target.closest('.btn')) {
                        toggleLeadDetails(lead.id, e);
                    }
                });

                list.appendChild(trMain);
                list.appendChild(trDetail);
            });
        }

        window.toggleLeadDetails = (leadId, event) => {
            if (event) {
                event.stopPropagation();
            }
            const detailRow = document.getElementById(`detail-row-${leadId}`);
            const mainRow = document.getElementById(`lead-row-${leadId}`);
            if (!detailRow || !mainRow) return;

            const chevron = mainRow.querySelector('.btn-toggle-detail');

            if (expandedLeadIds.has(leadId)) {
                expandedLeadIds.delete(leadId);
                detailRow.classList.add('hidden');
                if (chevron) chevron.classList.remove('active');
            } else {
                expandedLeadIds.add(leadId);
                detailRow.classList.remove('hidden');
                if (chevron) chevron.classList.add('active');
            }
        };
    </script>
</body>
</html>
