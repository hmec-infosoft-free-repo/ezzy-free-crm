    <style>
        .view-section {
            height: 100%;
            overflow-y: auto;
            padding: 20px;
        }
        .tool-container {
            padding: 32px;
            max-width: 900px;
            margin: 0 auto;
        }
        .question-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-glass);
            display: flex;
            flex-direction: column;
            gap: 24px;
            min-height: 800px;
        }
        .quick-section {
            margin-bottom: 24px;
            padding: 20px;
            background: rgba(255,255,255,0.02);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }
        .quick-group {
            margin-bottom: 15px;
        }
        .quick-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .quick-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .btn-quick {
            padding: 8px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-quick:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        .btn-quick.line {
            border-color: var(--primary);
            color: var(--primary);
        }
        #searchSuggestions {
            min-height: 38px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .tag-pill {
            padding: 6px 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-muted);
            transition: all 0.2s;
            white-space: nowrap;
        }
        .tag-pill:hover, .tag-pill.active {
            background: var(--primary-light);
            border-color: var(--primary);
            color: white;
        }
        .ai-input-area {
            display: flex;
            flex-direction: column;
        }
        .search-bar {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-bar i {
            position: absolute;
            left: 15px;
            color: var(--text-muted);
        }
        .response-area {
            background: rgba(0,0,0,0.2);
            border-radius: var(--radius-md);
            padding: 20px;
            border: 1px solid var(--border-color);
        }
        .ai-badge {
            background: var(--primary);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            margin-right: 8px;
        }
    </style>
</head>

                    nkiResources.push(...data[cat]);

            }

            try {
                const resp = await fetch('yt-video-hmec-machines.json');
                const data = await resp.json();

        function resolveResources(template, company) {
            const resources = company === "HMEC MACHINES" ? hmecResources : nkiResources;
            const res = resources.find(r => 
                r.name.toLowerCase().includes(template.name.toLowerCase()) || 
                template.name.toLowerCase().includes(r.name.toLowerCase())
            );

            let productLink = template.productLink;
            let youtubeLink = template.youtube;

            if (res) {
                if (res.youtube && res.youtube !== "#") youtubeLink = res.youtube;
                if (res.website && res.website !== "#") productLink = res.website;
            } else if (company === "HMEC MACHINES") {
                productLink = "https://www.hmec-machines.com/";
                youtubeLink = "https://www.youtube.com/@hmecmachines";
            }

            return { productLink, youtube: youtubeLink };
        }

        function renderSuggestions(filter) {
            suggestionsDiv.innerHTML = "";
            const filtered = filter ? 
                machineTemplates.filter(t => 
                    t.name.toLowerCase().includes(filter) || 
                    (t.keywords && t.keywords.some(k => k.includes(filter)))
                ) : [];

            filtered.forEach(t => {
                const pill = document.createElement('span');
                pill.className = t.isLine ? 'tag-pill primary' : 'tag-pill';
                pill.style.cursor = 'pointer';
                pill.innerHTML = t.name;
                pill.onclick = () => {
                    selectedTemplate = t;
                    selectedDisplayName = t.name; // User searched specific
                    searchInput.value = t.name;
                    generateResponse();
                };
                suggestionsDiv.appendChild(pill);
            });
        }

        // SEARCH LOGIC: Intelligent matching to find the 'Nearest Category'.
        // e.g., "6 Head Liquid Filling" will match the "Liquid Filling Machine" template.
        function autoSelectFirstMatch(val) {
            if (val.length < 3) return;
            
            // Priority 1: Check if search query contains a specific template name
            const sortedTemplates = [...machineTemplates].sort((a, b) => b.name.length - a.name.length);
            let match = sortedTemplates.find(t => val.includes(t.name.toLowerCase()));
            
            // Priority 2: Check if template name contains the search query
            if (!match) {
                match = sortedTemplates.find(t => t.name.toLowerCase().includes(val));
            }

            // Priority 3: Hardcoded Keyword fallbacks for core categories
            if (!match) {
                if (val.includes("liquid filling")) match = machineTemplates.find(t => t.id === "filling");
                else if (val.includes("powder filling")) match = machineTemplates.find(t => t.id === "auger");
                else if (val.includes("capping")) match = machineTemplates.find(t => t.id === "capping");
                else if (val.includes("labeling")) match = machineTemplates.find(t => t.id === "labeling");
                else if (val.includes("washing")) match = machineTemplates.find(t => t.id === "washing");
                else if (val.includes("rfc") || val.includes("rinsing")) match = machineTemplates.find(t => t.id === "rfc");
                else if (val.includes("tank") || val.includes("storage") || val.includes("process")) match = machineTemplates.find(t => t.id === "process");
                else if (val.includes("intro") || val.includes("company")) match = machineTemplates.find(t => t.id === "intro");
            }

            if (match) {
                selectedTemplate = match;
                selectedDisplayName = match.name;
                generateResponse();
            }
        }
