<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Ezzy Free CRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="site-hf/version.js"></script>
</head>
<body>
    <!-- Application Structure Container -->
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar"><script>if(localStorage.getItem('sidebarCollapsed')==='true')document.querySelector('.sidebar').classList.add('collapsed');</script></aside>

        <!-- Main Settings Workspace -->
        <main class="main-content">
            <header class="top-bar"></header>

            <div class="content-header">
                <div class="header-titles">
                    <h1>Settings</h1>
                    <p>Configure your CRM preferences and data storage.</p>
                </div>
            </div>

            <div id="settingsView" class="view-section">
                <div class="detail-card-full">
                    <h4>Storage Settings</h4>
                    <p class="text-muted mb-4">Your leads are stored locally in the <code>local-data/</code> directory.</p>
                    
                    <div class="form-group">
                        <label>Current Year</label>
                        <select disabled>
                            <option>2026</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Hidden elements for app.js compatibility -->
            <div id="dashboardView" class="hidden"></div>
            <div id="leadsView" class="hidden"></div>
            <div id="leadDatabaseView" class="hidden"></div>
            <div id="companiesView" class="hidden"></div>
            <div id="addLeadBtn" class="hidden"></div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
