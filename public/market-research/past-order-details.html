<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details - Market Research</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .page-container {
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
        }
        .detail-row {
            display: flex;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .detail-row:last-child {
            border-bottom: none;
        }
        .detail-label {
            width: 250px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .detail-value {
            flex: 1;
            color: var(--text-main);
            font-weight: 500;
        }
        .detail-value.highlight {
            color: #10b981;
            font-weight: 600;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar"><script>if(localStorage.getItem('sidebarCollapsed')==='true')document.querySelector('.sidebar').classList.add('collapsed');</script></aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search..." disabled>
                </div>
                <div class="user-profile">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" alt="Profile">
                    <span>Admin</span>
                </div>
            </header>

            <div class="content-header">
                <div class="header-titles">
                    <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 8px;">
                        <a href="companywise-export.html" style="color: var(--text-muted); text-decoration: none; transition: color 0.2s;"><i class="fas fa-arrow-left"></i> Back to Company Exports</a>
                    </div>
                    <h1><i class="fas fa-file-invoice" style="color: var(--primary); margin-right: 12px;"></i> Order Details</h1>
                    <p>Detailed view of the export transaction.</p>
                </div>
            </div>

            <div class="view-section">
                <div class="page-container">
                    <div class="card">
                        <div style="margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start;">
                            <div>
                                <h2 style="margin: 0 0 8px 0; color: var(--text-main);" id="order-title">Transaction Details</h2>
                                <span style="color: var(--text-muted); font-size: 14px;" id="order-subtitle">View the complete breakdown of this export order</span>
                            </div>
                            <span style="background: rgba(16, 185, 129, 0.1); color: #10b981; padding: 6px 12px; border-radius: 20px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px;">
                                <i class="fas fa-check-circle"></i> Completed
                            </span>
                        </div>
                        
                        <div style="background: var(--bg-main); padding: 24px; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
                            <div class="detail-row" style="padding-top: 0;">
                                <div class="detail-label"><i class="far fa-calendar-alt" style="margin-right: 8px; width: 16px; text-align: center;"></i> Date</div>
                                <div class="detail-value" id="detail-date">-</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label"><i class="fas fa-box-open" style="margin-right: 8px; width: 16px; text-align: center;"></i> Machine/Product</div>
                                <div class="detail-value" id="detail-machine">-</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label"><i class="fas fa-cubes" style="margin-right: 8px; width: 16px; text-align: center;"></i> Quantity</div>
                                <div class="detail-value" id="detail-qty">-</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label"><i class="fas fa-tag" style="margin-right: 8px; width: 16px; text-align: center;"></i> Unit Price</div>
                                <div class="detail-value" id="detail-price">-</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label"><i class="fas fa-money-bill-wave" style="margin-right: 8px; width: 16px; text-align: center;"></i> Total Value</div>
                                <div class="detail-value highlight" id="detail-total">-</div>
                            </div>
                            <div class="detail-row" style="border-bottom: none; padding-bottom: 0;">
                                <div class="detail-label"><i class="fas fa-map-marker-alt" style="margin-right: 8px; width: 16px; text-align: center;"></i> Destination</div>
                                <div class="detail-value" id="detail-dest">-</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Load Sidebar
            try {
                const sidebarRes = await fetch('../site-hf/sidebar.html');
                let sidebarHtml = await sidebarRes.text();
                sidebarHtml = sidebarHtml.replace(/href="(?!\.\.\/|http)([^"]+)"/g, 'href="../$1"');
                const sidebarEl = document.querySelector('.sidebar');
                if (sidebarEl) {
                    sidebarEl.innerHTML = sidebarHtml;
                    if (localStorage.getItem('sidebarCollapsed') === 'true') {
                        sidebarEl.classList.add('collapsed');
                    }
                    const toggleBtn = sidebarEl.querySelector('#sidebarToggle');
                    if (toggleBtn) {
                        toggleBtn.addEventListener('click', () => {
                            sidebarEl.classList.toggle('collapsed');
                            localStorage.setItem('sidebarCollapsed', sidebarEl.classList.contains('collapsed'));
                        });
                    }
                    const activeEl = document.getElementById('nav-market-research');
                    if (activeEl) activeEl.classList.add('active');
                }
            } catch (err) {
                console.error('Error loading sidebar:', err);
            }

            // Parse URL params
            const params = new URLSearchParams(window.location.search);
            if(params.has('date')) document.getElementById('detail-date').textContent = params.get('date');
            if(params.has('machine')) {
                document.getElementById('detail-machine').textContent = params.get('machine');
                document.getElementById('order-title').textContent = params.get('machine');
            }
            if(params.has('qty')) document.getElementById('detail-qty').textContent = params.get('qty');
            if(params.has('price')) document.getElementById('detail-price').textContent = params.get('price');
            if(params.has('total')) document.getElementById('detail-total').textContent = params.get('total');
            if(params.has('dest')) document.getElementById('detail-dest').textContent = params.get('dest');
        });
    </script>
</body>
</html>
